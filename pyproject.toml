[project]
name = "snapshot-replay-lab"
version = "0.1.0"
description = "Lightweight local harness to replay a real voice-agent call turn through core/leaping and ablate models / prompts / snapshots for behavioural testing."
requires-python = ">=3.12,<3.14"
dependencies = [
    "leaping",
    "streamlit>=1.40",
    "openai>=1.3.8,<2",
    "pandas>=2.0",
]

[tool.uv.sources]
leaping = { path = "../leaping/core", editable = true }
